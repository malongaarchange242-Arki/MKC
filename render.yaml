services:
  - type: web
    name: mkc-node-api
    runtime: node
    rootDir: backend/node-api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PYTHON_SERVICE_URL
        sync: false
      - key: PYTHON_SERVICE_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false