<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=0" />
  <meta name="api-base" content="https://mkc-ymuo.onrender.com" />
  <title>Messages — Maritime Kargo Consulting</title>
  <link rel="icon" type="image/svg+xml" href="favicon-mkc.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    :root {
      color-scheme: light;
      --navy-900: #071d33;
      --navy-800: #0b2945;
      --navy-700: #0e3260;
      --ocean: #126b8a;
      --orange: #f58220;
      --ink: #0b2540;
      --muted: #64748b;
      --line: #e2eaf1;
      --page: #f3f6f8;
      --font: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
      font-family: var(--font);
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-size: 16px; }
    body { color: var(--ink); background: var(--page); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    button, input, textarea { font: inherit; }
    .app-container { display: flex; width: 100%; height: 100%; min-width: 0; flex-direction: row; }
    #main-list-container { display: flex; width: 34%; min-width: 270px; max-width: 390px; height: 100%; min-height: 0; flex: 0 0 auto; flex-direction: column; background: #fff; border-right: 1px solid var(--line); }
    .header {
      z-index: 2;
      display: flex;
      min-height: 76px;
      flex: 0 0 auto;
      align-items: center;
      gap: 14px;
      padding: 10px 16px;
      color: #fff;
      background: var(--navy-900);
      box-shadow: 0 4px 18px rgba(7,29,51,.14);
    }
    .header-icon { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; color: var(--navy-900); background: var(--orange); border-radius: 12px; font-size: 18px; }
    .header-copy { min-width: 0; }
    .header h2 { margin: 0; color: #fff; font-size: 1.12rem; font-weight: 750; letter-spacing: -.02em; }
    .header-subtitle { margin: 4px 0 0; color: rgba(255,255,255,.67); font-size: .78rem; }
    .inbox-back-link { display: none; min-height: 38px; align-items: center; gap: 8px; padding: 0 11px; color: #fff; border: 1px solid rgba(255,255,255,.27); border-radius: 8px; font-size: .78rem; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .inbox-back-link.visible { display: inline-flex; }
    .inbox-back-link:hover { background: rgba(255,255,255,.1); }
    .header-actions { display: flex; align-items: center; gap: 9px; margin-left: auto; }
    .client-profile { display: none; min-width: 0; align-items: center; gap: 7px; color: #fff; }
    body.client-inbox .client-profile { display: flex; }
    .client-profile-avatar { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; overflow: hidden; color: var(--navy-900); background: var(--orange); border-radius: 50%; font-size: .68rem; font-weight: 750; }
    .client-profile-avatar img { display: block; width: 100%; height: 100%; object-fit: cover; }
    .client-profile-copy { min-width: 0; }
    .client-profile-name, .client-profile-role { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .client-profile-name { max-width: 118px; color: #fff; font-size: .68rem; font-weight: 700; }
    .client-profile-role { color: rgba(255,255,255,.67); font-size: .59rem; }
    #btn-load-disputes { display: inline-flex; min-height: 40px; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; color: var(--navy-900); background: var(--orange); border: 1px solid var(--orange); border-radius: 8px; font-size: .81rem; font-weight: 700; cursor: pointer; transition: background .18s ease, transform .18s ease; }
    #btn-load-disputes:hover { background: #ff9a36; transform: translateY(-1px); }
    .header-subtitle { display: none; }
    body.admin-inbox .header { gap: 8px; padding-right: 10px; padding-left: 10px; }
    body.admin-inbox .header-copy { flex: 1 1 auto; }
    body.admin-inbox .header h2 { font-size: .94rem; line-height: 1.25; }
    body.admin-inbox .inbox-back-link { width: 34px; min-width: 34px; justify-content: center; gap: 0; padding: 0; font-size: 0; }
    body.admin-inbox .inbox-back-link i { font-size: 13px; }
    body.admin-inbox #btn-load-disputes { width: 38px; min-width: 38px; justify-content: center; gap: 0; padding: 0; font-size: 0; }
    body.admin-inbox #btn-load-disputes i { font-size: 13px; }
    body.admin-modal .inbox-back-link { display: none !important; }
    body.client-inbox .header { gap: 8px; padding-right: 10px; padding-left: 10px; }
    body.client-inbox .header-icon { display: none; }
    body.client-inbox .header-copy { flex: 1 1 auto; }
    body.client-inbox .header h2 { font-size: .94rem; line-height: 1.25; }
    body.client-inbox .inbox-back-link { width: 34px; min-width: 34px; justify-content: center; gap: 0; padding: 0; font-size: 0; }
    body.client-inbox .inbox-back-link i { font-size: 13px; }
    body.client-inbox #btn-load-disputes { width: 38px; min-width: 38px; justify-content: center; gap: 0; padding: 0; font-size: 0; }
    body.client-inbox #btn-load-disputes i { font-size: 13px; }
    #list-view { width: 100%; min-height: 0; flex: 1 1 auto; overflow-y: auto; margin: 0; padding: 10px; }
    .conversation-row { position: relative; display: flex; width: 100%; min-height: 76px; flex-direction: column; gap: 6px; margin: 0 0 6px; padding: 12px; color: inherit; background: #fff; border: 1px solid transparent; border-bottom-color: var(--line); border-radius: 9px; text-align: left; cursor: pointer; transition: background .16s ease, border-color .16s ease; }
    .conversation-row:hover { background: #f7fafc; border-color: #e7eef4; }
    .conversation-row.is-active { background: #eef5fa; border-color: #d7e6f1; box-shadow: inset 3px 0 var(--orange); }
    .conversation-row:focus-visible { outline: 3px solid rgba(245,130,32,.48); outline-offset: 2px; }
    .type-conteste { border-left-color: #d92d20; }
    .type-normal { border-left-color: var(--orange); }
    .row-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
    .row-title { min-width: 0; overflow: hidden; color: var(--navy-900); font-size: .94rem; font-weight: 750; text-overflow: ellipsis; }
    .row-header small { flex: 0 0 auto; color: var(--muted); font-size: .72rem; }
    .row-preview { overflow: hidden; color: #53687c; font-size: .83rem; line-height: 1.5; text-overflow: ellipsis; white-space: nowrap; }
    #no-conversations { display: grid; min-height: 150px; place-items: center; padding: 28px 18px !important; color: var(--muted) !important; text-align: center; line-height: 1.5; }
    #chat-view {
      position: relative;
      display: flex;
      width: 0;
      height: 100%;
      min-width: 0;
      min-height: 0;
      flex: 1 1 auto;
      flex-direction: column;
      overflow: hidden;
      background: var(--page);
      border: 0;
    }
    #chat-empty { display: flex; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 28px; color: var(--muted); text-align: center; }
    #chat-empty[hidden] { display: none; }
    #chat-empty i { color: #9db1c3; font-size: 2rem; }
    #chat-empty strong { color: var(--navy-900); font-size: .95rem; }
    #chat-empty span { max-width: 300px; font-size: .8rem; line-height: 1.55; }
    .conversation-chat { display: flex; width: 100%; height: 100%; min-height: 0; flex-direction: column; }
    .chat-header { z-index: 1; display: flex; min-height: 64px; flex: 0 0 auto; align-items: center; gap: 11px; padding: 10px 18px; background: var(--navy-900); box-shadow: 0 4px 16px rgba(7,29,51,.12); }
    .chat-back { display: grid; width: 34px; height: 34px; flex: 0 0 auto; place-items: center; color: #fff; background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.2); border-radius: 9px; font-size: 14px; cursor: pointer; }
    .chat-back:hover { color: var(--orange); background: rgba(255,255,255,.16); }
    #chat-title { min-width: 0; flex: 1; overflow: hidden; color: #fff; font-size: .9rem; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .messages-history { width: 100%; min-height: 0; flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; margin: 0; padding: 20px clamp(14px, 3vw, 42px); }
    .msg { display: flex; flex-direction: column; }
    .msg.me { align-items: flex-end; }
    .msg.other { align-items: flex-start; }
    .bubble { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: .82rem; line-height: 1.55; overflow-wrap: anywhere; white-space: pre-wrap; box-shadow: 0 3px 10px rgba(7,29,51,.06); }
    .msg.me .bubble { color: #fff; background: linear-gradient(145deg, var(--navy-700), var(--navy-900)); border-bottom-right-radius: 4px; }
    .msg.other .bubble { color: var(--ink); background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .msg small { margin: 5px 5px 0 !important; color: var(--muted) !important; font-size: .69rem !important; }
    .composer { display: flex; flex: 0 0 auto; align-items: flex-end; gap: 9px; padding: 12px 18px; background: #fff; border-top: 1px solid var(--line); }
    .composer textarea { min-width: 0; min-height: 42px; max-height: 120px; flex: 1; resize: vertical; padding: 11px 15px; color: var(--ink); background: var(--page); border: 1px solid #d5e0e9; border-radius: 16px; outline: none; font-size: .86rem; line-height: 1.4; }
    .composer textarea:focus { border-color: var(--ocean); box-shadow: 0 0 0 3px rgba(18,107,138,.12); }
    .composer button { display: grid; width: 42px; height: 42px; flex: 0 0 auto; place-items: center; color: var(--navy-900); background: var(--orange); border: 0; border-radius: 50%; font-size: 14px; cursor: pointer; transition: background .18s ease, transform .18s ease; }
    .composer button:hover:not(:disabled) { background: #ff9a36; transform: translateY(-1px); }
    .composer button:disabled { opacity: .48; cursor: not-allowed; }
    .chat-status { min-height: 20px; padding: 0 18px 7px; color: #b42332; background: #fff; font-size: .76rem; }
    .chat-status:empty { display: none; }
    .loading-state, .empty-state { display: flex; min-height: 100%; align-items: center; justify-content: center; gap: 9px; color: var(--muted); font-size: .84rem; text-align: center; }
    .load-error { display: flex; max-width: 420px; flex-direction: column; align-items: center; gap: 12px; padding: 24px; color: #b42332; text-align: center; line-height: 1.5; }
    .retry-load { padding: 8px 12px; color: var(--navy-900); background: #fff; border: 1px solid var(--line); border-radius: 8px; font-weight: 650; cursor: pointer; }
    .retry-load:hover { background: #f5f8fb; }
    .row-preview { display: flex; align-items: center; gap: 5px; }
    .row-preview-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    button:focus-visible, a:focus-visible { outline: 3px solid rgba(245,130,32,.55); outline-offset: 3px; }
    .hidden { display: none !important; }
    @media (max-width: 620px) {
      #main-list-container { width: 100%; min-width: 0; max-width: none; border-right: 0; }
      .app-container.has-active-conversation #main-list-container { display: none; }
      .app-container.has-active-conversation #chat-view { display: flex; width: 100%; }
      .app-container:not(.has-active-conversation) #chat-view { display: none; }
    }
    @media (max-width: 760px) {
      .header { min-height: 70px; gap: 10px; padding: 10px 13px; }
      .header-icon { width: 37px; height: 37px; border-radius: 10px; font-size: 16px; }
      .header h2 { font-size: .94rem; }
      .header-subtitle { font-size: .68rem; }
      .inbox-back-link { width: 36px; min-width: 36px; height: 36px; justify-content: center; padding: 0; overflow: hidden; font-size: 0; }
      .inbox-back-link i { font-size: 14px; }
      .header-actions { gap: 0; }
      .client-profile { gap: 5px; }
      .client-profile-avatar { width: 27px; height: 27px; }
      .client-profile-name { max-width: 86px; font-size: .63rem; }
      .client-profile-role { font-size: .56rem; }
      #btn-load-disputes { min-height: 37px; gap: 6px; padding: 0 10px; font-size: .73rem; }
      #list-view { width: 100%; padding: 10px 12px 20px; }
      .conversation-row { min-height: 82px; gap: 7px; padding: 14px 13px 14px 16px; }
      .row-title { font-size: .85rem; }
      .row-header small { font-size: .65rem; }
      .row-preview { font-size: .77rem; }
      .chat-header { min-height: 58px; gap: 9px; padding: 8px 11px; }
      .chat-back { width: 33px; height: 33px; }
      #chat-title { font-size: .84rem; }
      .messages-history { padding: 13px 10px; }
      .bubble { max-width: 90%; padding: 9px 11px; font-size: .8rem; }
      .composer { gap: 7px; padding: 8px 9px; }
      .composer textarea { min-height: 40px; font-size: .8rem; }
      .composer button { width: 40px; height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>

<div class="app-container">
  
  <div id="main-list-container">
    <div class="header">
      <a id="admin-inbox-back" class="inbox-back-link" href="dashboard_admin.html" aria-label="Retour au tableau de bord admin"><i class="fas fa-arrow-left" aria-hidden="true"></i><span>Tableau de bord</span></a>
      <span class="header-icon" aria-hidden="true"><i class="fas fa-envelope-open-text"></i></span>
      <div class="header-copy">
        <h2>Mes Messages</h2>
        <p class="header-subtitle">Échangez avec notre équipe au sujet de vos demandes.</p>
      </div>
      <div class="header-actions">
        <div class="client-profile" id="client-profile" aria-label="Profil client">
          <span class="client-profile-avatar" id="client-profile-avatar" aria-hidden="true">U</span>
          <span class="client-profile-copy">
            <span class="client-profile-name" id="client-profile-name">Utilisateur</span>
            <span class="client-profile-role" id="client-profile-role">Client</span>
          </span>
        </div>
        <button id="btn-load-disputes" type="button"><i class="fas fa-rotate" aria-hidden="true"></i><span>Charger</span></button>
      </div>
    </div>

    <div id="list-view">
      <div id="no-conversations">Aucune conversation pour le moment.</div>
    </div>
  </div>

  <div id="chat-view" aria-label="Conversation">
  <div id="chat-empty">
    <i class="fas fa-comments" aria-hidden="true"></i>
    <strong>Sélectionnez une conversation</strong>
    <span>Choisissez un échange dans la liste pour consulter son historique et répondre.</span>
  </div>
  <div id="chat-content" class="conversation-chat hidden">
    <div class="chat-header">
      <button class="chat-back" onclick="closeChat()" type="button" aria-label="Retour aux conversations">
        <i class="fas fa-arrow-left" aria-hidden="true"></i>
      </button>
      <div id="chat-title">Sujet</div>
    </div>
    <div id="messages-history" class="messages-history" aria-live="polite"></div>
    <div id="chat-status" class="chat-status" role="status" aria-live="polite"></div>
    <div class="composer">
      <textarea id="msg-input" rows="1" placeholder="Écrire un message…" aria-label="Écrire un message"></textarea>
      <button id="msg-send" type="button" aria-label="Envoyer" disabled><i class="fas fa-paper-plane" aria-hidden="true"></i></button>
    </div>
  </div>
  </div>

</div>

<script>
  let activeThreadId = null;
  let activeConversationButton = null;
  const pageParams = new URLSearchParams(window.location.search);
  const isAdminInbox = pageParams.get('admin') === '1';
  const isAdminModal = pageParams.get('modal') === '1';
  const isClientInbox = pageParams.get('client') === '1' || (!isAdminInbox && !isAdminModal);
  const requestedThreadId = pageParams.get('requestId');
  document.body.classList.toggle('admin-inbox', isAdminInbox);
  document.body.classList.toggle('admin-modal', isAdminModal);
  document.body.classList.toggle('client-inbox', isClientInbox);

  function getApiBase() {
    const configuredBase = document.querySelector('meta[name="api-base"]')?.content?.trim();
    const isLocalHost = ['localhost', '127.0.0.1'].includes(window.location.hostname);
    return (window.__API_BASE__ || configuredBase || (isLocalHost ? 'http://localhost:3000' : 'https://mkc-ymuo.onrender.com')).replace(/\/+$/, '');
  }

  function getAuthHeaders() {
    const token = localStorage.getItem('access_token') || localStorage.getItem('token');
    return token ? { Authorization: `Bearer ${token}` } : {};
  }

  async function loadClientProfile() {
    if (!isClientInbox) return;
    const token = localStorage.getItem('access_token') || localStorage.getItem('token');
    if (!token) return;
    try {
      const response = await fetch(`${getApiBase()}/users/me`, { headers: getAuthHeaders() });
      if (!response.ok) throw new Error(`Profile request failed (${response.status})`);
      const payload = await response.json();
      const profile = payload?.profile || payload?.user || payload?.data || payload;
      const nom = profile?.nom || profile?.last_name || profile?.family_name || '';
      const prenom = profile?.prenom || profile?.first_name || profile?.given_name || '';
      const fullName = `${nom} ${prenom}`.trim();
      const name = document.getElementById('client-profile-name');
      const role = document.getElementById('client-profile-role');
      const avatar = document.getElementById('client-profile-avatar');
      if (name) name.textContent = fullName || profile?.email || 'Utilisateur';
      if (role) role.textContent = profile?.role || profile?.user_metadata?.role || 'Client';
      if (avatar) {
        const initials = `${nom.charAt(0)}${prenom.charAt(0)}`.toUpperCase() || 'MA';
        if (typeof profile?.avatar_url === 'string' && profile.avatar_url) {
          const image = document.createElement('img');
          image.src = profile.avatar_url;
          image.alt = '';
          avatar.replaceChildren(image);
        } else {
          avatar.textContent = initials;
        }
      }
    } catch (error) {
      console.warn('Unable to load client profile in messages', error);
    }
  }

  loadClientProfile();

  // Simple i18n helper: prefer local `window.i18n.t`, then parent `window.parent.i18n.t` (iframe case), fallback to provided defaults
  function __(key, fallback) {
    try {
      if (window.i18n && typeof window.i18n.t === 'function') {
        const val = window.i18n.t(key);
        if (val && val !== key) return val;
      }
    } catch (e) { /* ignore */ }
    try {
      if (window.parent && window.parent.i18n && typeof window.parent.i18n.t === 'function') {
        const val2 = window.parent.i18n.t(key);
        if (val2 && val2 !== key) return val2;
      }
    } catch (e) { /* ignore cross-window access */ }
    return fallback || key;
  }

  function localizeStaticTexts() {
    try {
      const titleEl = document.querySelector('.header h2');
      if (titleEl) titleEl.innerText = isAdminInbox ? 'Messages des clients' : __('messages.title', 'Mes Messages');
      if (isAdminInbox && !isAdminModal) document.getElementById('admin-inbox-back')?.classList.add('visible');
      if (isClientInbox) {
        const backLink = document.getElementById('admin-inbox-back');
        if (backLink) {
          backLink.href = 'dashboard_client.html';
          backLink.target = '_top';
          backLink.setAttribute('aria-label', 'Retour au tableau de bord client');
          backLink.querySelector('span').innerText = 'Tableau de bord';
          backLink.classList.add('visible');
        }
        const refreshButton = document.getElementById('btn-load-disputes');
        refreshButton?.setAttribute('aria-label', 'Actualiser les conversations');
        refreshButton?.setAttribute('title', 'Actualiser les conversations');
      }
      const loadLabel = document.querySelector('#btn-load-disputes span');
      if (loadLabel) loadLabel.innerText = __('messages.load', 'Charger');
      const noConv = document.getElementById('no-conversations');
      if (noConv) noConv.innerText = __('messages.no_conversations', 'Aucune conversation pour le moment.');
      const chatTitle = document.getElementById('chat-title');
      if (chatTitle && !chatTitle.dataset.localized) { chatTitle.dataset.localized = '1'; chatTitle.innerText = __('messages.subject', 'Sujet'); }
      const msgInput = document.getElementById('msg-input');
      if (msgInput) msgInput.placeholder = __('messages.compose_placeholder', 'Écrire un message…');
      const msgSend = document.getElementById('msg-send');
      if (msgSend) msgSend.title = __('messages.send', 'Envoyer');
    } catch (e) { /* ignore */ }
  }

  // Listen for i18n change notifications from parent (if any) and re-localize
  window.addEventListener('message', (ev) => {
    try {
      const p = ev.data || {};
      if (p && (p.type === 'i18n:changed' || p.type === 'i18n:setLang')) {
        localizeStaticTexts();
      } else if (p?.type === 'messages:refresh') {
        refreshConversations();
        if (activeThreadId) renderMessages(activeThreadId);
      }
    } catch (e) { /* ignore */ }
  });

  // Try re-localizing shortly after load to pick up parent i18n state
  setTimeout(() => { try { localizeStaticTexts(); } catch (e) {} }, 200);

  let activeThreadTitle = '';
  let messageLoadSequence = 0;
  let isLoadingMessages = false;
  let isSendingMessage = false;
  let currentUserId = null;
  try {
    const token = localStorage.getItem('access_token') || localStorage.getItem('token');
    const payload = token ? JSON.parse(atob(token.split('.')[1])) : null;
    currentUserId = payload?.id || payload?.sub || payload?.user_id || null;
  } catch (error) {
    currentUserId = null;
  }

  function openChat(threadId, type, displayTitle) {
    activeThreadId = threadId;
    activeThreadTitle = displayTitle || ((type === 'conteste') ? __('messages.dispute', 'Contestation') : threadId);
    document.querySelector('.app-container').classList.add('has-active-conversation');
    document.getElementById('chat-empty').hidden = true;
    document.getElementById('chat-content').classList.remove('hidden');
    document.getElementById('chat-title').innerText = activeThreadTitle;
    activeConversationButton = null;
    document.querySelectorAll('.conversation-row').forEach(row => {
      const isActive = row.dataset.requestId === threadId;
      row.classList.toggle('is-active', isActive);
      row.setAttribute('aria-current', isActive ? 'true' : 'false');
      if (isActive) activeConversationButton = row;
    });
    renderMessages(threadId);
  }

  function closeChat() {
    const returnFocus = activeConversationButton;
    activeThreadId = null;
    activeThreadTitle = '';
    activeConversationButton = null;
    isLoadingMessages = false;
    messageLoadSequence++;
    document.querySelector('.app-container').classList.remove('has-active-conversation');
    document.getElementById('chat-empty').hidden = false;
    document.getElementById('chat-content').classList.add('hidden');
    document.getElementById('chat-status').textContent = '';
    document.querySelectorAll('.conversation-row').forEach(row => {
      row.classList.remove('is-active');
      row.removeAttribute('aria-current');
    });
    if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true });
  }

  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape') return;
    if (activeThreadId) closeChat();
    else if (window.parent !== window) window.parent.postMessage({ type: 'messages:close' }, window.location.origin);
  });

  function formatDate(value) {
    const date = value ? new Date(value) : null;
    if (!date || Number.isNaN(date.getTime())) return '';
    const datePart = new Intl.DateTimeFormat('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(date);
    const timePart = new Intl.DateTimeFormat('fr-FR', { hour: '2-digit', minute: '2-digit' }).format(date);
    return `${datePart} à ${timePart}`;
  }

  function showChatStatus(message, isError = true) {
    const status = document.getElementById('chat-status');
    status.textContent = message || '';
    status.style.color = isError ? '#b42332' : 'var(--muted)';
  }

  function updateSendButton() {
    const input = document.getElementById('msg-input');
    const button = document.getElementById('msg-send');
    input.disabled = isLoadingMessages || isSendingMessage || !activeThreadId;
    button.disabled = !activeThreadId || isLoadingMessages || isSendingMessage || !input.value.trim();
    button.innerHTML = isSendingMessage
      ? '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>'
      : '<i class="fas fa-paper-plane" aria-hidden="true"></i>';
    button.setAttribute('aria-label', isSendingMessage ? 'Envoi en cours' : 'Envoyer');
  }

  async function renderMessages(threadId) {
    const history = document.getElementById('messages-history');
    const sequence = ++messageLoadSequence;
    isLoadingMessages = true;
    showChatStatus('');
    updateSendButton();
    history.innerHTML = `<div class="loading-state"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>${escapeHtml(__('messages.loading', 'Chargement des messages…'))}</div>`;

    try {
      const messages = await fetchThreadMessages(threadId);
      if (sequence !== messageLoadSequence || activeThreadId !== threadId) return;
      if (messages.length === 0) {
        history.innerHTML = `<div class="empty-state">${escapeHtml(__('messages.no_messages_in_thread', 'Aucun message dans cette discussion.'))}</div>`;
        return;
      }
      history.innerHTML = messages.map(message => {
        const senderRole = String(message.sender_role || '').toUpperCase();
        const senderId = String(message.sender_id || message.raised_by || '');
        const senderIdentity = senderId && currentUserId && senderId === String(currentUserId);
        const clientSender = ['CLIENT', 'USER', 'ME'].includes(senderRole) || senderIdentity;
        const isMine = isAdminInbox ? !clientSender : clientSender;
        const timestamp = formatDate(message.created_at || message.createdAt || message.time);
        return `<div class="msg ${isMine ? 'me' : 'other'}"><div class="bubble">${escapeHtml(message.content || message.reason || message.text || '')}</div><small>${escapeHtml(timestamp)}</small></div>`;
      }).join('');
      history.scrollTop = history.scrollHeight;
    } catch (error) {
      if (sequence !== messageLoadSequence || activeThreadId !== threadId) return;
      console.error('Failed to load conversation messages', error);
      history.innerHTML = `<div class="load-error" role="alert"><span>${escapeHtml(error instanceof Error ? error.message : __('messages.load_error', 'Impossible de charger les messages.'))}</span><button class="retry-load" type="button">${escapeHtml(__('messages.retry', 'Réessayer'))}</button></div>`;
    } finally {
      if (sequence === messageLoadSequence) {
        isLoadingMessages = false;
        updateSendButton();
      }
    }
  }

  async function send() {
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    const threadId = activeThreadId;
    if (!text || !threadId || isSendingMessage || isLoadingMessages) return;

    isSendingMessage = true;
    showChatStatus(__('messages.sending', 'Envoi du message…'), false);
    updateSendButton();
    try {
      const formData = new FormData();
      formData.append('content', text);
      const response = await fetch(`${getApiBase()}/api/requests/${encodeURIComponent(threadId)}/messages`, {
        method: 'POST',
        headers: getAuthHeaders(),
        body: formData
      });
      let responsePayload = null;
      try {
        responsePayload = await response.json();
      } catch (error) {
        responsePayload = null;
      }
      if (!response.ok) {
        const detail = responsePayload?.message || responsePayload?.error || '';
        if (response.status === 401) throw new Error(__('messages.login_required', 'Votre session a expiré. Veuillez vous reconnecter.'));
        throw new Error(detail || `${__('messages.send_error', 'Impossible d’envoyer le message.')} (${response.status})`);
      }
      if (responsePayload?.success === false) {
        throw new Error(responsePayload.message || __('messages.send_error', 'Impossible d’envoyer le message.'));
      }
      if (input.value.trim() === text) input.value = '';
      if (activeThreadId === threadId) {
        showChatStatus('');
        await renderMessages(threadId);
      }
      await refreshConversations();
    } catch (error) {
      console.error('Failed to send conversation message', error);
      if (activeThreadId === threadId) {
        showChatStatus(error instanceof Error ? error.message : __('messages.send_error', 'Impossible d’envoyer le message.'));
      }
    } finally {
      isSendingMessage = false;
      updateSendButton();
      if (activeThreadId === threadId) input.focus({ preventScroll: true });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // Fetch disputes/messages for a given request id from backend
  async function fetchThreadMessages(threadId) {
    if (!threadId) throw new Error(__('messages.load_error', 'Conversation introuvable.'));
    const base = getApiBase();
    const headers = getAuthHeaders();
    const [disputesResponse, messagesResponse] = await Promise.all([
      fetch(`${base}/api/requests/${encodeURIComponent(threadId)}/disputes`, { headers }),
      fetch(`${base}/api/requests/${encodeURIComponent(threadId)}/messages`, { headers })
    ]);

    if ([disputesResponse, messagesResponse].some(response => response.status === 401)) {
      throw new Error(__('messages.login_required', 'Votre session a expiré. Veuillez vous reconnecter.'));
    }
    const failedResponse = [disputesResponse, messagesResponse].find(response => !response.ok);
    if (failedResponse) {
      throw new Error(`${__('messages.load_error', 'Impossible de charger les messages.')} (${failedResponse.status})`);
    }

    const [disputesPayload, messagesPayload] = await Promise.all([
      disputesResponse.json(),
      messagesResponse.json()
    ]);
    const disputes = Array.isArray(disputesPayload) ? disputesPayload
      : Array.isArray(disputesPayload?.data) ? disputesPayload.data
      : Array.isArray(disputesPayload?.disputes) ? disputesPayload.disputes : null;
    const messages = Array.isArray(messagesPayload) ? messagesPayload
      : Array.isArray(messagesPayload?.data) ? messagesPayload.data
      : Array.isArray(messagesPayload?.messages) ? messagesPayload.messages : null;
    if (!disputes || !messages) {
      throw new Error(__('messages.load_error', 'Réponse invalide du serveur.'));
    }

    return [
      ...disputes.map(dispute => ({
        ...dispute,
        type: 'dispute',
        sender_id: dispute.sender_id || null,
        sender_role: dispute.sender_role || dispute.from || dispute.raised_by || '',
        content: dispute.reason || dispute.content || dispute.description || '',
        created_at: dispute.created_at || dispute.createdAt || dispute.created || null
      })),
      ...messages.map(message => ({
        ...message,
        type: 'message',
        sender_role: message.sender_role || message.from || '',
        content: message.content || message.text || message.body || '',
        created_at: message.created_at || message.createdAt || message.time || null
      }))
    ].sort((left, right) => {
      const leftTime = Date.parse(left.created_at || '') || 0;
      const rightTime = Date.parse(right.created_at || '') || 0;
      return leftTime - rightTime;
    });
  }

  // Fetch all disputes from several possible admin endpoints
  async function fetchAllDisputes() {
    const token = localStorage.getItem('access_token') || localStorage.getItem('token');
    if (!token) throw new Error(__('messages.login_required', 'Votre session a expiré. Veuillez vous reconnecter.'));

    const base = getApiBase();
    const headers = getAuthHeaders();
    if (isAdminInbox) {
      const response = await fetch(`${base}/admin/client-inbox`, { headers });
      if (response.status === 401 || response.status === 403) {
        throw new Error(__('messages.login_required', 'Votre session administrateur a expiré. Veuillez vous reconnecter.'));
      }
      if (!response.ok) {
        let detail = '';
        try {
          const errorPayload = await response.json();
          detail = errorPayload?.message || '';
        } catch (error) {
          detail = '';
        }
        throw new Error(detail || `${__('messages.load_error', 'Impossible de charger les conversations')} (${response.status})`);
      }
      const payload = await response.json();
      if (!Array.isArray(payload?.data)) {
        throw new Error(__('messages.load_error', 'Réponse invalide du serveur.'));
      }
      return payload.data;
    }

    const [disputesResponse, messagesResponse] = await Promise.all([
      fetch(`${base}/api/requests/disputes`, { headers }),
      fetch(`${base}/api/requests/messages`, { headers })
    ]);

    if (disputesResponse.status === 401 || messagesResponse.status === 401) {
      throw new Error(__('messages.login_required', 'Votre session a expiré. Veuillez vous reconnecter.'));
    }

    const failedResponse = [disputesResponse, messagesResponse].find(response => !response.ok);
    if (failedResponse) {
      throw new Error(`${__('messages.load_error', 'Impossible de charger les conversations')} (${failedResponse.status})`);
    }

    const [disputesPayload, messagesPayload] = await Promise.all([
      disputesResponse.json(),
      messagesResponse.json()
    ]);
    const disputes = Array.isArray(disputesPayload) ? disputesPayload
      : Array.isArray(disputesPayload?.data) ? disputesPayload.data
      : Array.isArray(disputesPayload?.disputes) ? disputesPayload.disputes : null;
    const messages = Array.isArray(messagesPayload) ? messagesPayload
      : Array.isArray(messagesPayload?.data) ? messagesPayload.data
      : Array.isArray(messagesPayload?.messages) ? messagesPayload.messages : null;

    if (!disputes || !messages) {
      throw new Error(__('messages.load_error', 'Réponse invalide du serveur.'));
    }
    return [...disputes, ...messages].sort((left, right) => {
      const leftDate = Date.parse(left.created_at || left.createdAt || '') || 0;
      const rightDate = Date.parse(right.created_at || right.createdAt || '') || 0;
      return leftDate - rightDate;
    });
  }

  document.getElementById('msg-send').addEventListener('click', send);
  document.getElementById('messages-history').addEventListener('click', event => {
    if (event.target.closest('.retry-load') && activeThreadId) renderMessages(activeThreadId);
  });
  document.getElementById('msg-input').addEventListener('input', updateSendButton);
  document.getElementById('msg-input').addEventListener('keydown', event => {
    if (event.key === 'Enter' && !event.shiftKey) {
      event.preventDefault();
      send();
    }
  });

  window.addEventListener('message', event => {
    const payload = event.data || {};
    if (payload.type === 'admin_message' && payload.threadId === activeThreadId) {
      renderMessages(activeThreadId);
      refreshConversations();
    }
  });

  async function refreshConversations() {
    const button = document.getElementById('btn-load-disputes');
    const list = document.getElementById('list-view');
    const originalLabel = button.querySelector('span').textContent;
    button.disabled = true;
    button.querySelector('i').className = 'fas fa-spinner fa-spin';
    button.querySelector('span').textContent = __('messages.loading', 'Chargement…');
    if (!list.querySelector('.conversation-row')) {
      list.innerHTML = `<div class="loading-state"><i class="fas fa-spinner fa-spin" aria-hidden="true"></i>${escapeHtml(__('messages.loading_conversations', 'Chargement des conversations…'))}</div>`;
    }

    try {
      const entries = await fetchAllDisputes();
      const grouped = new Map();
      entries.forEach(entry => {
        const requestId = entry.request_id || entry.requestId || entry.request;
        if (!requestId) return;
        const thread = grouped.get(String(requestId)) || [];
        thread.push(entry);
        grouped.set(String(requestId), thread);
      });

      const conversations = Array.from(grouped.entries()).map(([requestId, thread]) => {
        thread.sort((left, right) => {
          const leftDate = Date.parse(left.created_at || left.createdAt || '') || 0;
          const rightDate = Date.parse(right.created_at || right.createdAt || '') || 0;
          return leftDate - rightDate;
        });
        return { requestId, entries: thread, latest: thread[thread.length - 1] };
      }).sort((left, right) => {
        const leftDate = Date.parse(left.latest.created_at || left.latest.createdAt || '') || 0;
        const rightDate = Date.parse(right.latest.created_at || right.latest.createdAt || '') || 0;
        return rightDate - leftDate;
      });

      list.replaceChildren();
      if (conversations.length === 0) {
        const empty = document.createElement('div');
        empty.id = 'no-conversations';
        empty.textContent = __('messages.no_conversations', 'Aucune conversation pour le moment.');
        list.appendChild(empty);
        return;
      }

      conversations.forEach(conversation => {
        const { requestId, latest } = conversation;
        const displayName = isAdminInbox
          ? latest.client_name || latest.sender_name || __('messages.client', 'Client')
          : latest.admin_name || latest.sender_name || __('messages.support', 'Équipe MKC');
        const reference = latest.bl_number || latest.extracted_bl || latest.manual_bl;
        const title = reference ? `${displayName} · BL ${reference}` : displayName;
        const preview = latest.content || latest.text || latest.reason || latest.description || '';
        const row = document.createElement('button');
        row.type = 'button';
        row.className = `conversation-row ${latest.type === 'DISPUTE' || latest.raised_by ? 'type-conteste' : 'type-normal'}`;
        row.dataset.requestId = requestId;
        row.setAttribute('aria-label', `${title}. ${preview}`);
        row.classList.toggle('is-active', requestId === activeThreadId);
        row.innerHTML = `<span class="row-header"><span class="row-title">${escapeHtml(title)}</span><small>${escapeHtml(formatDate(latest.created_at || latest.createdAt))}</small></span><span class="row-preview"><span class="row-preview-text">${escapeHtml(preview || __('messages.no_messages_preview', 'Aucun message'))}</span></span>`;
        row.addEventListener('click', () => openChat(requestId, latest.type === 'DISPUTE' ? 'conteste' : 'normal', title));
        list.appendChild(row);
      });
      const requestedConversation = requestedThreadId
        ? conversations.find(conversation => conversation.requestId === requestedThreadId)
        : null;
      if (requestedConversation && !activeThreadId) {
        const { requestId, latest } = requestedConversation;
        const displayName = latest.admin_name || latest.sender_name || __('messages.support', 'Équipe MKC');
        const reference = latest.bl_number || latest.extracted_bl || latest.manual_bl;
        const title = reference ? `${displayName} · BL ${reference}` : displayName;
        openChat(requestId, latest.type === 'DISPUTE' ? 'conteste' : 'normal', title);
      }
    } catch (error) {
      console.error('Failed to load conversations', error);
      if (!list.querySelector('.conversation-row')) {
        list.replaceChildren();
      }
      const errorMessage = document.createElement('div');
      errorMessage.className = 'empty-state';
      errorMessage.setAttribute('role', 'alert');
      errorMessage.textContent = error instanceof Error ? error.message : __('messages.load_error', 'Impossible de charger les conversations.');
      list.prepend(errorMessage);
    } finally {
      button.disabled = false;
      button.querySelector('i').className = 'fas fa-rotate';
      button.querySelector('span').textContent = originalLabel;
    }
  }

  document.getElementById('btn-load-disputes').addEventListener('click', refreshConversations);

  // Auto-load disputes on page load
  window.addEventListener('load', () => {
    localizeStaticTexts();
    refreshConversations();
  });
</script>
