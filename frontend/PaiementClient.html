<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="api-base" content="https://mkc-ymuo.onrender.com">
    <title>LOGI-RDC | My Payments</title>
    <link rel="stylesheet" href="dashboard_client.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module" src="api.js"></script>
</head>

<body class="payments-page">
    <div class="app-container">
        <nav class="sidebar" id="sidebar" aria-label="Navigation principale">
            <div class="sidebar-mobile-header">
                <button class="sidebar-close-btn" id="close-sidebar-btn" aria-label="Fermer le menu" type="button">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="sidebar-logo">
                <img src="Logotype_mkc_bon-removebg-preview.png" alt="Maritime Kargo Consulting" class="sidebar-logo-img" width="46" height="46" />
                <div class="sidebar-logo-text">
                    <div class="sidebar-brand"><span class="sb-maritime">MARITIME </span><span class="sb-kargo">KARGO</span></div>
                    <div class="sb-consulting">CONSULTING</div>
                    <div class="sb-tagline">FERI · AD · INTERNATIONAL TRADE</div>
                </div>
            </div>
            <div class="sidebar-section-label" data-i18n="client_area">ESPACE CLIENT</div>
            <ul class="sidebar-nav" role="menu">
                <li class="nav-item" role="menuitem" tabindex="0" onclick="window.location.href='dashboard_client.html'">
                    <span class="nav-active-bar" aria-hidden="true"></span>
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="3" width="7" height="7" rx="1" /><rect x="14" y="3" width="7" height="7" rx="1" />
                        <rect x="3" y="14" width="7" height="7" rx="1" /><rect x="14" y="14" width="7" height="7" rx="1" />
                    </svg>
                    <span data-i18n="dashboard">Tableau de bord</span>
                </li>
                <li class="nav-item active" role="menuitem" tabindex="0" aria-current="page">
                    <span class="nav-active-bar" aria-hidden="true"></span>
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="1" y="4" width="22" height="16" rx="2" /><line x1="1" y1="10" x2="23" y2="10" />
                    </svg>
                    <span data-i18n="payments">Paiements</span>
                </li>
                <li class="nav-item" role="menuitem" tabindex="0" id="nav-notif" onclick="window.location.href='dashboard_client.html#notifications'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.href='dashboard_client.html#notifications'}">
                    <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" /><path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span data-i18n="notifications">Notifications</span>
                    <span class="sidebar-notif-badge" id="sidebar-notif-badge" style="display:none;"></span>
                </li>
            </ul>
            <div class="sidebar-logout" role="button" tabindex="0" id="logoutBtn" aria-label="Déconnexion">
                <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" /><line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                <span data-i18n="logout">Déconnexion</span>
            </div>
        </nav>

        <main class="main-content" role="main">
            <header class="top-header">
                <div class="header-left">
                    <button class="hamburger-btn icon-btn" id="menu-trigger" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <line x1="3" y1="6" x2="21" y2="6" /><line x1="3" y1="12" x2="21" y2="12" />
                            <line x1="3" y1="18" x2="21" y2="18" />
                        </svg>
                    </button>
                    <span class="mobile-header-brand" aria-hidden="true">MKC</span>
                </div>
                <div class="header-right">
                    <label class="language-control" for="lang-select" data-i18n-title="language_title">
                        <svg class="language-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"></path>
                        </svg>
                        <span class="visually-hidden" data-i18n="language">Langue</span>
                        <select id="lang-select" class="lang-selector" aria-label="Language" data-i18n-aria-label="language_aria_label">
                            <option value="fr">Français</option>
                            <option value="en">English</option>
                        </select>
                        <svg class="lang-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
                    </label>
                    <div class="header-sep" aria-hidden="true"></div>
                    <a class="icon-btn payment-header-link" href="dashboard_client.html#notifications" aria-label="Notifications" title="Notifications">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                            <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                        </svg>
                    </a>
                    <a class="icon-btn payment-header-link" href="messages_page.html" aria-label="Messages" title="Messages">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                            <polyline points="22,6 12,13 2,6" />
                        </svg>
                    </a>
                    <div class="header-sep" aria-hidden="true"></div>
                    <div class="user-profile">
                        <div class="avatar-placeholder" aria-hidden="true"></div>
                        <div class="user-info">
                            <span class="user-name name"></span>
                            <span class="user-role role">Client</span>
                        </div>
                    </div>
                </div>
            </header>

            <div class="content-scroll">
                <section class="page-hero requests-hero">
                    <div class="page-hero-left">
                        <div class="hero-accent-line" aria-hidden="true"></div>
                        <h1 class="requests-page-title" data-i18n="payments">Paiements</h1>
                        <p class="hero-subtitle" data-i18n="pending_invoices">Factures en attente de paiement</p>
                    </div>
                </section>

                <section class="requests-card" aria-label="Factures en attente de paiement">
                    <div class="table-responsive">
                        <table class="dashboard-table">
                            <thead>
                                <tr>
                                    <th><span data-i18n="bl_number">N° BL</span></th>
                                    <th><span data-i18n="description">Description</span></th>
                                    <th><span data-i18n="amount_due">Montant dû</span></th>
                                    <th><span data-i18n="status">Statut</span></th>
                                    <th><span data-i18n="action">Action</span></th>
                                    <th><span data-i18n="payment_mode">Mode de paiement</span></th>
                                </tr>
                            </thead>
                            <tbody id="client-payment-body"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>
    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Fermer le menu" hidden></button>

    <div id="payment-upload-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3 data-i18n="submit_payment_proof">Submit Payment Proof</h3>
            </div>
            <div class="modal-body">
                <p><span data-i18n="bl_reference">BL Reference:</span> <strong id="modal-bl-ref" class="text-blue"></strong></p>
                <div class="upload-group" style="margin-top:20px;">
                    <label class="doc-upload-btn" for="proof-file">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <span id="label-proof" data-i18n="upload_receipt">Upload Receipt (PDF/JPG)</span>
                        <input type="file" id="proof-file" hidden accept=".pdf,.jpg,.jpeg,.png">
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-close" onclick="closePaymentModal()" data-i18n="cancel">Cancel</button>
                <button id="submit-proof-btn" class="btn-submit" style="display:none;" data-i18n="send_proof">Send Proof</button>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="Payment_client.js"></script>
    <script>
        var trigger = document.getElementById('menu-trigger');
        var sidebar = document.getElementById('sidebar');
        var closeBtn = document.getElementById('close-sidebar-btn');
        var backdrop = document.getElementById('sidebar-backdrop');
        function setMenuOpen(open) {
            if (!sidebar || !trigger) return;
            sidebar.classList.toggle('show', open);
            trigger.setAttribute('aria-expanded', String(open));
            if (backdrop) backdrop.hidden = !open;
            if (open && closeBtn) closeBtn.focus();
            else if (closeBtn && document.activeElement === closeBtn) trigger.focus();
        }
        if (trigger && sidebar) trigger.addEventListener('click', function () { setMenuOpen(!sidebar.classList.contains('show')); });
        if (closeBtn) closeBtn.addEventListener('click', function () { setMenuOpen(false); });
        if (backdrop) backdrop.addEventListener('click', function () { setMenuOpen(false); });
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && sidebar && sidebar.classList.contains('show')) setMenuOpen(false);
        });
        var logoutBtn = document.getElementById('logoutBtn');
        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
            localStorage.removeItem('token');
            window.location.href = 'index.html';
        }
        logoutBtn.addEventListener('click', logout);
        logoutBtn.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                logout();
            }
        });
    </script>
</body>

</html>
